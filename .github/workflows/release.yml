# Linux release builds. Each package is built on the distribution it targets,
# so it links against that distribution's GTK, WebKitGTK and libsodium.
#
# Push a tag like v0.1.0: builds the tarball, .deb and .rpm and attaches them
# to a draft GitHub release, which you review and publish by hand.
# Push a release-* branch, or run it manually (Actions > Release > Run workflow):
# builds only, as artifacts, to check the packages before tagging.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["release-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Tarball and .deb (Ubuntu 26.04)
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libsqlite3-dev libsodium-dev dpkg-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --locked
      - name: Build
        # libsodium's soname differs across distributions (.23 here, .26 on others): link it in.
        # cargo rustc passes these flags to the mallow binary only, not to dependencies.
        run: >-
          cargo rustc --release --locked --bin mallow --
          -l static=sodium -L native=/usr/lib/x86_64-linux-gnu
      - name: Tarball
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          # install.sh finds packages by the tag's version: they must match.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2; exit 1
          fi
          dir="mallow-$version-linux-x86_64"
          mkdir -p "$dir/bin" "$dir/share/applications" "$dir/share/icons/hicolor/scalable/apps"
          install -m755 target/release/mallow "$dir/bin/"
          install -m644 packaging/dev.mallow.Browser.desktop "$dir/share/applications/"
          install -m644 assets/icons/dev.mallow.Browser.svg "$dir/share/icons/hicolor/scalable/apps/"
          install -m644 LICENSE README.md PASSWORDS.md "$dir/"
          mkdir -p dist
          tar -czf "dist/$dir.tar.gz" "$dir"
      - name: .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --output dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deb-and-tarball
          path: dist/*

  rpm:
    name: .rpm (Fedora)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y gcc pkgconf-pkg-config git rpm-build \
            gtk4-devel webkitgtk6.0-devel sqlite-devel libsodium-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: .rpm
        run: |
          cargo install cargo-generate-rpm --locked
          mkdir -p dist
          cargo generate-rpm --output dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/*

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      # Mallow's updater installs a release only if SHA256SUMS verifies against
      # RELEASE_KEY in src/update.rs, the public half of this secret.
      - name: Sign checksums
        env:
          SIGNING_KEY: ${{ secrets.MALLOW_SIGNING_KEY }}
        run: |
          [ -n "$SIGNING_KEY" ] || { echo "The MALLOW_SIGNING_KEY secret is not set." >&2; exit 1; }
          key="$RUNNER_TEMP/signing-key.pem"
          (umask 077; printf '%s\n' "$SIGNING_KEY" > "$key")
          openssl pkeyutl -sign -inkey "$key" -rawin -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          rm -f "$key"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --title "Mallow ${GITHUB_REF_NAME#v}" \
            --notes "Linux builds of Mallow ${GITHUB_REF_NAME#v}. The .deb is built on Ubuntu 26.04 and the .rpm on current Fedora; the tarball needs GTK 4.20 or later and WebKitGTK 6.0 2.50 or later from your distribution."
