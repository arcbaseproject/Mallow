[package]
name = "mallow"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-channel = "0.3"
glib-unix = "0.22.8"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_20"] }
rusqlite = "0.43.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
webkit6 = { version = "0.6.1", features = ["v2_50"] }

[build-dependencies]
glib-build-tools = "0.22.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
