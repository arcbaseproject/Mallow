<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>{{title}}</title>
<style>
{{tokens}}
html { background: var(--surface); color: var(--on-surface); font-family: system-ui, sans-serif; }
body { display: flex; min-height: 90vh; margin: 0; align-items: center; justify-content: center; }
main { max-width: 520px; padding: 32px; }
.badge { display: inline-flex; width: 64px; height: 64px; border-radius: 20px; align-items: center; justify-content: center;
  background: var(--error); color: var(--on-error); font-size: 32px; font-weight: 700; }
h1 { font-size: 28px; font-weight: 500; margin: 24px 0 8px; }
p { color: var(--on-surface-variant); line-height: 1.5; margin: 0 0 8px; }
code { display: block; margin: 16px 0 24px; color: var(--outline); font-size: 12px; word-break: break-all; }
.retry { display: inline-block; text-decoration: none; font: inherit; font-weight: 500; border: none; border-radius: 999px; padding: 10px 24px; cursor: pointer;
  background: var(--primary); color: var(--on-primary); }
.retry:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<main>
<div class="badge" aria-hidden="true">!</div>
<h1>{{title}}</h1>
<p>{{hint}}</p>
<p>{{message}}</p>
<code>{{code}}</code>
<!-- A fresh navigation: location.reload() reloads the substituted error HTML, giving about:blank. -->
<a class="retry" href="{{uri}}">Try again</a>
</main>
</body>
</html>
